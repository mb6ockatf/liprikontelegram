# ci.yml - lint main.lua and build the Docker image.
#
# Copyright (C) 2026 mb6ockatf
# This file is free software; see COPYING for copying conditions.
#
# luacheck reads .luacheckrc.  The image is built but not pushed;
# docker.yml publishes it on version tags.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  luacheck:
    name: luacheck
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - name: Install luacheck
        run: |
          apt-get update
          apt-get install -y --no-install-recommends lua-check
      - name: Check main.lua
        run: |
          luacheck --version
          luacheck --no-color main.lua

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: liprikontelegram:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
